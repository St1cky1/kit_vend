services:
  app:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "50051:50051"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DB_PORT=5432
      - SERVER_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - KIT_COMPANY_ID=${KIT_COMPANY_ID}
      - KIT_LOGIN=${KIT_LOGIN}
      - KIT_PASSWORD=${KIT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
